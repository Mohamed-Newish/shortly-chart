apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: shortly
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: shortly
      component: redis
  template:
    metadata:
      labels:
        app: shortly
        component: redis
    spec:
      containers:
        - name: redis
          image: {{.Values.redis.image}}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{.Values.redis.storage}}