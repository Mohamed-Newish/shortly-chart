apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: shortly
      component: frontend
  template:
    metadata:
      labels:
        app: shortly
        component: frontend
    spec:
      initContainers:                  # nginx resolves its upstream once, at startup, and
        - name: wait-for-api           # dies with "host not found in upstream" if api is absent
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z api 3000; do echo "waiting for api:3000"; sleep 2; done
      containers:
        - name: frontend
          image: {{.Values.frontend.image}}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: shortly
    component: frontend
  ports:
    - port: 80
      targetPort: 80