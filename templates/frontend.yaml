apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: shortly
      component: frontend
  template:
    metadata:
      labels:
        app: shortly
        component: frontend
    spec:
      containers:
        - name: frontend
          image: {{.Values.frontend.image}}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: shortly
    component: frontend
  ports:
    - port: 80
      targetPort: 80