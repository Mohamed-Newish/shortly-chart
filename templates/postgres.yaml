apiVersion: v1
kind: Service
metadata:
  name: db                      # the hostname the API already expects (DB_HOST=db)
spec:
  clusterIP: None               # "headless" — gives stable DNS db-0.db, needed by StatefulSets
  selector:
    app: shortly
    component: db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: shortly
      component: db
  template:
    metadata:
      labels:
        app: shortly
        component: db
    spec:
      containers:
        - name: postgres
          image: {{.Values.postgres.image}}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:          # <- the StatefulSet's per-pod PVC
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: {{.Values.postgres.storage}}