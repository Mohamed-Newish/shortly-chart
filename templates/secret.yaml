apiVersion: v1
kind: Secret
metadata:
  name: api-secrets            # the exact name api's secretRef and postgres's secretKeyRef look for
type: Opaque                   # the default — arbitrary key/value pairs (what `create secret generic` makes)
stringData:                    # plaintext here; Kubernetes base64-encodes it on the way into etcd
  DB_USER: {{ .Values.secrets.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
